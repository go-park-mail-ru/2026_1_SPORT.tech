name: Backend CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, Vet, Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run backend checks
        run: make ci

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend images
        run: make docker-build

  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs:
      - quality
      - docker-build
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ github.ref_name }}
        with:
          host: ${{ secrets.BACKEND_DEPLOY_HOST }}
          username: ${{ secrets.BACKEND_DEPLOY_USER }}
          key: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          port: ${{ secrets.BACKEND_DEPLOY_PORT || 22 }}
          envs: DEPLOY_REF
          script_stop: true
          script: |
            set -euo pipefail
            sudo DEPLOY_REF="$DEPLOY_REF" BACKEND_DEPLOY_PATH="${{ secrets.BACKEND_DEPLOY_PATH }}" bash -lc '
              set -euo pipefail
              cd "$BACKEND_DEPLOY_PATH"
              git fetch origin "$DEPLOY_REF"
              git checkout "$DEPLOY_REF" || git checkout -b "$DEPLOY_REF" "origin/$DEPLOY_REF"
              git pull --ff-only origin "$DEPLOY_REF"
              docker compose build
              docker compose up -d --remove-orphans
              docker compose ps
            '
