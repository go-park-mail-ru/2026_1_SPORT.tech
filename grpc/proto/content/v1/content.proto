syntax = "proto3";

package sporttech.content.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_SPORT.tech/grpc/gen/go/content/v1;contentv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ContentService {
  rpc ListAuthorPosts(ListAuthorPostsRequest) returns (ListAuthorPostsResponse) {
    option (google.api.http).get = "/v1/authors/{author_user_id}/posts";
  }

  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse) {
    option (google.api.http) = {
      post: "/v1/posts:search"
      body: "*"
    };
  }

  rpc CreatePost(CreatePostRequest) returns (PostResponse) {
    option (google.api.http) = {
      post: "/v1/posts"
      body: "*"
    };
  }

  rpc UploadPostMedia(UploadPostMediaRequest) returns (PostMediaResponse) {
    option (google.api.http) = {
      post: "/v1/posts/media"
      body: "*"
    };
  }

  rpc GetPost(GetPostRequest) returns (PostResponse) {
    option (google.api.http).get = "/v1/posts/{post_id}";
  }

  rpc UpdatePost(UpdatePostRequest) returns (PostResponse) {
    option (google.api.http) = {
      patch: "/v1/posts/{post_id}"
      body: "*"
    };
  }

  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/posts/{post_id}";
  }

  rpc ListSubscriptionTiers(ListSubscriptionTiersRequest) returns (ListSubscriptionTiersResponse) {
    option (google.api.http).get = "/v1/trainers/{trainer_user_id}/tiers";
  }

  rpc CreateSubscriptionTier(CreateSubscriptionTierRequest) returns (SubscriptionTier) {
    option (google.api.http) = {
      post: "/v1/trainers/{trainer_user_id}/tiers"
      body: "*"
    };
  }

  rpc UpdateSubscriptionTier(UpdateSubscriptionTierRequest) returns (SubscriptionTier) {
    option (google.api.http) = {
      patch: "/v1/trainers/{trainer_user_id}/tiers/{tier_id}"
      body: "*"
    };
  }

  rpc DeleteSubscriptionTier(DeleteSubscriptionTierRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/trainers/{trainer_user_id}/tiers/{tier_id}";
  }

  rpc SubscribeToTrainer(SubscribeToTrainerRequest) returns (Subscription) {
    option (google.api.http) = {
      post: "/v1/trainers/{trainer_user_id}/subscribe"
      body: "*"
    };
  }

  rpc ListMySubscriptions(ListMySubscriptionsRequest) returns (ListMySubscriptionsResponse) {
    option (google.api.http).get = "/v1/users/{client_user_id}/subscriptions";
  }

  rpc ListTrainerSubscribers(ListTrainerSubscribersRequest) returns (ListTrainerSubscribersResponse) {
    option (google.api.http).get = "/v1/trainers/{trainer_user_id}/subscribers";
  }

  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (Subscription) {
    option (google.api.http) = {
      patch: "/v1/users/{client_user_id}/subscriptions/{subscription_id}"
      body: "*"
    };
  }

  rpc CancelSubscription(CancelSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/users/{client_user_id}/subscriptions/{subscription_id}";
  }

  rpc DonateToProfile(DonateToProfileRequest) returns (DonationResponse) {
    option (google.api.http) = {
      post: "/v1/users/{recipient_user_id}/donations"
      body: "*"
    };
  }

  rpc CreateDonationPayment(CreateDonationPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/donations"
      body: "*"
    };
  }

  rpc CreateSubscriptionPayment(CreateSubscriptionPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/subscriptions"
      body: "*"
    };
  }

  rpc ConfirmDonationPayment(ConfirmDonationPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/{payment_id}/confirm"
      body: "*"
    };
  }

  rpc GetBalance(GetBalanceRequest) returns (BalanceResponse) {
    option (google.api.http).get = "/v1/users/{trainer_user_id}/balance";
  }

  rpc GetTrainerStatistics(GetTrainerStatisticsRequest) returns (TrainerStatisticsResponse) {
    option (google.api.http).get = "/v1/users/{trainer_user_id}/statistics";
  }

  rpc ListReceivedDonations(ListReceivedDonationsRequest) returns (ListReceivedDonationsResponse) {
    option (google.api.http).get = "/v1/users/{trainer_user_id}/donations/received";
  }

  rpc LikePost(LikePostRequest) returns (PostLikeStateResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/likes"
      body: "*"
    };
  }

  rpc UnlikePost(UnlikePostRequest) returns (PostLikeStateResponse) {
    option (google.api.http).delete = "/v1/posts/{post_id}/likes/{user_id}";
  }

  rpc CreateComment(CreateCommentRequest) returns (CommentResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/comments"
      body: "*"
    };
  }

  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse) {
    option (google.api.http).get = "/v1/posts/{post_id}/comments";
  }

  rpc UpdateComment(UpdateCommentRequest) returns (CommentResponse) {
    option (google.api.http) = {
      patch: "/v1/comments/{comment_id}"
      body: "*"
    };
  }

  rpc DeleteComment(DeleteCommentRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/comments/{comment_id}";
  }

  rpc ListPostLikes(ListPostLikesRequest) returns (ListPostLikesResponse) {
    option (google.api.http).get = "/v1/posts/{post_id}/likes";
  }

  rpc ListNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http).get = "/v1/users/{user_id}/notifications";
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (NotificationResponse) {
    option (google.api.http) = {
      patch: "/v1/users/{user_id}/notifications/{notification_id}/read"
      body: "*"
    };
  }

  rpc GetNotificationPreferences(GetNotificationPreferencesRequest) returns (NotificationPreferencesResponse) {
    option (google.api.http).get = "/v1/users/{user_id}/notification-preferences";
  }

  rpc UpdateNotificationPreferences(UpdateNotificationPreferencesRequest) returns (NotificationPreferencesResponse) {
    option (google.api.http) = {
      put: "/v1/users/{user_id}/notification-preferences"
      body: "*"
    };
  }

  rpc SendChatMessage(SendChatMessageRequest) returns (ChatMessage) {
    option (google.api.http) = {
      post: "/v1/chat/messages"
      body: "*"
    };
  }

  rpc ListChatMessages(ListChatMessagesRequest) returns (ListChatMessagesResponse) {
    option (google.api.http).get = "/v1/users/{user_id}/chat/messages/{other_user_id}";
  }

  rpc ListChatConversations(ListChatConversationsRequest) returns (ListChatConversationsResponse) {
    option (google.api.http).get = "/v1/users/{user_id}/chat/conversations";
  }

  rpc MarkChatMessageRead(MarkChatMessageReadRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      patch: "/v1/chat/messages/{message_id}/read"
      body: "*"
    };
  }

  rpc CreateMeetingAvailabilityRule(CreateMeetingAvailabilityRuleRequest) returns (MeetingAvailabilityRule);
  rpc ListMeetingAvailabilityRules(ListMeetingAvailabilityRulesRequest) returns (ListMeetingAvailabilityRulesResponse);
  rpc DeleteMeetingAvailabilityRule(DeleteMeetingAvailabilityRuleRequest) returns (google.protobuf.Empty);
  rpc CreateMeetingSlot(CreateMeetingSlotRequest) returns (MeetingSlot);
  rpc DeleteMeetingSlot(DeleteMeetingSlotRequest) returns (google.protobuf.Empty);
  rpc ListMeetingSlots(ListMeetingSlotsRequest) returns (ListMeetingSlotsResponse);
  rpc ListTrainerMeetingAvailability(ListTrainerMeetingAvailabilityRequest) returns (ListTrainerMeetingAvailabilityResponse);
  rpc BookMeeting(BookMeetingRequest) returns (MeetingBooking);
  rpc AssignMeeting(AssignMeetingRequest) returns (MeetingBooking);
  rpc CancelMeeting(CancelMeetingRequest) returns (google.protobuf.Empty);
  rpc ListMeetings(ListMeetingsRequest) returns (ListMeetingsResponse);
}

enum ContentBlockKind {
  CONTENT_BLOCK_KIND_UNSPECIFIED = 0;
  CONTENT_BLOCK_KIND_TEXT = 1;
  CONTENT_BLOCK_KIND_IMAGE = 2;
  CONTENT_BLOCK_KIND_VIDEO = 3;
  CONTENT_BLOCK_KIND_DOCUMENT = 4;
}

message PostBlockInput {
  ContentBlockKind kind = 1;
  optional string text_content = 2;
  optional string file_url = 3;
}

message PostBlock {
  int64 post_block_id = 1;
  int32 position = 2;
  ContentBlockKind kind = 3;
  optional string text_content = 4;
  optional string file_url = 5;
}

message PostMedia {
  string file_url = 1;
  ContentBlockKind kind = 2;
  string content_type = 3;
  int64 size_bytes = 4;
}

message Post {
  int64 post_id = 1;
  int64 author_user_id = 2;
  string title = 3;
  optional int32 required_subscription_level = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool can_view = 7;
  int64 likes_count = 8;
  bool is_liked = 9;
  int64 comments_count = 10;
  repeated PostBlock blocks = 11;
  optional int64 sport_type_id = 12;
  bool is_pinned = 13;
}

message PostSummary {
  int64 post_id = 1;
  int64 author_user_id = 2;
  string title = 3;
  optional int32 required_subscription_level = 4;
  google.protobuf.Timestamp created_at = 5;
  bool can_view = 6;
  int64 likes_count = 7;
  bool is_liked = 8;
  int64 comments_count = 9;
  optional int64 sport_type_id = 10;
  bool is_pinned = 11;
}

message Comment {
  int64 comment_id = 1;
  int64 post_id = 2;
  int64 author_user_id = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message Notification {
  int64 notification_id = 1;
  int64 user_id = 2;
  string type = 3;
  int64 actor_user_id = 4;
  string title = 5;
  string body = 6;
  bool is_read = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp read_at = 9;
  optional int64 post_id = 10;
  optional int64 comment_id = 11;
  optional int64 donation_id = 12;
  optional int64 subscription_id = 13;
}

message PostResponse {
  Post post = 1;
}

message ListAuthorPostsRequest {
  int64 author_user_id = 1;
  int64 viewer_user_id = 2;
  optional int32 viewer_subscription_level = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListAuthorPostsResponse {
  repeated PostSummary posts = 1;
}

message SearchPostsRequest {
  string query = 1;
  repeated int64 author_user_ids = 2;
  repeated ContentBlockKind block_kinds = 3;
  optional int32 min_required_subscription_level = 4;
  optional int32 max_required_subscription_level = 5;
  bool only_available = 6;
  int64 viewer_user_id = 7;
  optional int32 viewer_subscription_level = 8;
  int32 limit = 9;
  int32 offset = 10;
  repeated int64 sport_type_ids = 11;
  string sort = 12;
}

message SearchPostsResponse {
  repeated PostSummary posts = 1;
}

message CreatePostRequest {
  int64 author_user_id = 1;
  string title = 2;
  optional int32 required_subscription_level = 3;
  repeated PostBlockInput blocks = 4;
  optional int64 sport_type_id = 5;
}

message UploadPostMediaRequest {
  int64 author_user_id = 1;
  bytes file = 2;
  string file_name = 3;
  string content_type = 4;
}

message PostMediaResponse {
  PostMedia media = 1;
}

message GetPostRequest {
  int64 post_id = 1;
  int64 viewer_user_id = 2;
  optional int32 viewer_subscription_level = 3;
}

message UpdatePostRequest {
  int64 post_id = 1;
  int64 author_user_id = 2;
  optional string title = 3;
  optional int32 required_subscription_level = 4;
  bool clear_required_subscription_level = 5;
  repeated PostBlockInput blocks = 6;
  bool replace_blocks = 7;
  optional int64 sport_type_id = 8;
  bool clear_sport_type_id = 9;
  optional bool is_pinned = 10;
}

message SubscriptionTier {
  int64 tier_id = 1;
  int64 trainer_user_id = 2;
  string name = 3;
  int32 price = 4;
  optional string description = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool chat_enabled = 8;
  bool calendar_enabled = 9;
}

message ListSubscriptionTiersRequest {
  int64 trainer_user_id = 1;
}

message ListSubscriptionTiersResponse {
  repeated SubscriptionTier tiers = 1;
}

message CreateSubscriptionTierRequest {
  int64 trainer_user_id = 1;
  string name = 2;
  int32 price = 3;
  optional string description = 4;
  bool chat_enabled = 5;
  bool calendar_enabled = 6;
}

message UpdateSubscriptionTierRequest {
  int64 trainer_user_id = 1;
  int64 tier_id = 2;
  optional string name = 3;
  optional int32 price = 4;
  optional string description = 5;
  bool clear_description = 6;
  optional bool chat_enabled = 7;
  optional bool calendar_enabled = 8;
}

message DeleteSubscriptionTierRequest {
  int64 trainer_user_id = 1;
  int64 tier_id = 2;
}

message Subscription {
  int64 subscription_id = 1;
  int64 client_user_id = 2;
  int64 trainer_user_id = 3;
  int64 tier_id = 4;
  string tier_name = 5;
  int32 price = 6;
  bool active = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  bool auto_renew = 11;
  string stripe_subscription_id = 12;
  optional google.protobuf.Timestamp current_period_end = 13;
}

message SubscribeToTrainerRequest {
  int64 client_user_id = 1;
  int64 trainer_user_id = 2;
  int64 tier_id = 3;
}

message ListMySubscriptionsRequest {
  int64 client_user_id = 1;
}

message ListMySubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}

message ListTrainerSubscribersRequest {
  int64 trainer_user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListTrainerSubscribersResponse {
  repeated Subscription subscribers = 1;
}

message UpdateSubscriptionRequest {
  int64 client_user_id = 1;
  int64 subscription_id = 2;
  int64 tier_id = 3;
}

message CancelSubscriptionRequest {
  int64 client_user_id = 1;
  int64 subscription_id = 2;
}

message Donation {
  int64 donation_id = 1;
  int64 sender_user_id = 2;
  int64 recipient_user_id = 3;
  int32 amount_value = 4;
  string currency = 5;
  optional string message = 6;
  google.protobuf.Timestamp created_at = 7;
}

message DonateToProfileRequest {
  int64 sender_user_id = 1;
  int64 recipient_user_id = 2;
  int32 amount_value = 3;
  string currency = 4;
  optional string message = 5;
}

message DonationResponse {
  Donation donation = 1;
}

message Payment {
  int64 payment_id = 1;
  string provider_payment_id = 2;
  string status = 3;
  int64 sender_user_id = 4;
  int64 recipient_user_id = 5;
  int32 amount_value = 6;
  string currency = 7;
  optional string message = 8;
  string confirmation_token = 9;
  string confirmation_url = 10;
  optional Donation donation = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional google.protobuf.Timestamp confirmed_at = 14;
  optional Subscription subscription = 15;
}

message CreateDonationPaymentRequest {
  int64 sender_user_id = 1;
  int64 recipient_user_id = 2;
  int32 amount_value = 3;
  string currency = 4;
  optional string message = 5;
  optional string return_url = 6;
  optional string cancel_url = 7;
}

message CreateSubscriptionPaymentRequest {
  int64 client_user_id = 1;
  int64 trainer_user_id = 2;
  int64 tier_id = 3;
  optional string return_url = 4;
  optional string cancel_url = 5;
}

message ConfirmDonationPaymentRequest {
  int64 sender_user_id = 1;
  int64 payment_id = 2;
  string confirmation_token = 3;
}

message PaymentResponse {
  Payment payment = 1;
}

message GetBalanceRequest {
  int64 trainer_user_id = 1;
  string currency = 2;
}

message BalanceResponse {
  int64 trainer_user_id = 1;
  int32 amount_value = 2;
  string currency = 3;
}

message GetTrainerStatisticsRequest {
  int64 trainer_user_id = 1;
  string currency = 2;
}

message TrainerStatisticsResponse {
  int64 trainer_user_id = 1;
  int32 posts_count = 2;
  int32 donations_count = 3;
  int32 total_revenue = 4;
  int32 monthly_revenue = 5;
  string currency = 6;
}

message DeletePostRequest {
  int64 post_id = 1;
  int64 author_user_id = 2;
}

message LikePostRequest {
  int64 post_id = 1;
  int64 user_id = 2;
  optional int32 viewer_subscription_level = 3;
}

message UnlikePostRequest {
  int64 post_id = 1;
  int64 user_id = 2;
  optional int32 viewer_subscription_level = 3;
}

message PostLikeState {
  int64 post_id = 1;
  int64 likes_count = 2;
  bool is_liked = 3;
}

message PostLikeStateResponse {
  PostLikeState state = 1;
}

message PostLike {
  int64 post_id = 1;
  int64 user_id = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListPostLikesRequest {
  int64 post_id = 1;
  int64 viewer_user_id = 2;
  optional int32 viewer_subscription_level = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListPostLikesResponse {
  repeated PostLike likes = 1;
}

message CreateCommentRequest {
  int64 post_id = 1;
  int64 author_user_id = 2;
  optional int32 viewer_subscription_level = 3;
  string body = 4;
}

message UpdateCommentRequest {
  int64 comment_id = 1;
  int64 author_user_id = 2;
  string body = 3;
}

message DeleteCommentRequest {
  int64 comment_id = 1;
  int64 author_user_id = 2;
}

message CommentResponse {
  Comment comment = 1;
}

message ListCommentsRequest {
  int64 post_id = 1;
  int64 viewer_user_id = 2;
  optional int32 viewer_subscription_level = 3;
  int32 limit = 4;
  int32 offset = 5;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
}

message ListNotificationsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message MarkNotificationReadRequest {
  int64 user_id = 1;
  int64 notification_id = 2;
}

message NotificationPreferences {
  bool comments = 1;
  bool likes = 2;
  bool donations = 3;
  bool posts = 4;
  bool subscriptions = 5;
  bool meetings = 6;
  bool email_digest = 7;
}

message GetNotificationPreferencesRequest {
  int64 user_id = 1;
}

message UpdateNotificationPreferencesRequest {
  int64 user_id = 1;
  NotificationPreferences preferences = 2;
}

message NotificationPreferencesResponse {
  NotificationPreferences preferences = 1;
}

message NotificationResponse {
  Notification notification = 1;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message ChatMessage {
  int64 message_id = 1;
  int64 sender_user_id = 2;
  int64 receiver_user_id = 3;
  string body = 4;
  bool is_read = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ChatConversation {
  int64 other_user_id = 1;
  ChatMessage last_message = 2;
  int32 unread_count = 3;
}

message SendChatMessageRequest {
  int64 sender_user_id = 1;
  int64 receiver_user_id = 2;
  string body = 3;
}

message ListChatMessagesRequest {
  int64 user_id = 1;
  int64 other_user_id = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListChatMessagesResponse {
  repeated ChatMessage messages = 1;
}

message ListChatConversationsRequest {
  int64 user_id = 1;
}

message ListChatConversationsResponse {
  repeated ChatConversation conversations = 1;
}

message MarkChatMessageReadRequest {
  int64 user_id = 1;
  int64 message_id = 2;
}

message MeetingAvailabilityRule {
  int64 rule_id = 1;
  int64 trainer_user_id = 2;
  int32 weekday = 3;
  int32 start_hour = 4;
  google.protobuf.Timestamp created_at = 5;
}

message MeetingSlot {
  int64 slot_id = 1;
  int64 trainer_user_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp created_at = 4;
}

message MeetingAvailabilitySlot {
  google.protobuf.Timestamp starts_at = 1;
  google.protobuf.Timestamp ends_at = 2;
}

message MeetingBooking {
  int64 booking_id = 1;
  int64 trainer_user_id = 2;
  int64 client_user_id = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  string status = 6;
  int64 created_by_user_id = 7;
  optional string note = 8;
  google.protobuf.Timestamp created_at = 9;
}

message CreateMeetingAvailabilityRuleRequest {
  int64 trainer_user_id = 1;
  int32 weekday = 2;
  int32 start_hour = 3;
}

message ListMeetingAvailabilityRulesRequest {
  int64 trainer_user_id = 1;
}

message ListMeetingAvailabilityRulesResponse {
  repeated MeetingAvailabilityRule rules = 1;
}

message DeleteMeetingAvailabilityRuleRequest {
  int64 trainer_user_id = 1;
  int64 rule_id = 2;
}

message CreateMeetingSlotRequest {
  int64 trainer_user_id = 1;
  google.protobuf.Timestamp starts_at = 2;
}

message DeleteMeetingSlotRequest {
  int64 trainer_user_id = 1;
  int64 slot_id = 2;
}

message ListMeetingSlotsRequest {
  int64 trainer_user_id = 1;
}

message ListMeetingSlotsResponse {
  repeated MeetingSlot slots = 1;
}

message ListTrainerMeetingAvailabilityRequest {
  int64 trainer_user_id = 1;
  int64 viewer_user_id = 2;
  string from = 3;
  string to = 4;
}

message ListTrainerMeetingAvailabilityResponse {
  repeated MeetingAvailabilitySlot slots = 1;
}

message BookMeetingRequest {
  int64 client_user_id = 1;
  int64 trainer_user_id = 2;
  google.protobuf.Timestamp starts_at = 3;
}

message AssignMeetingRequest {
  int64 trainer_user_id = 1;
  int64 client_user_id = 2;
  google.protobuf.Timestamp starts_at = 3;
  int32 duration_hours = 4;
  optional string note = 5;
}

message CancelMeetingRequest {
  int64 user_id = 1;
  int64 booking_id = 2;
}

message ListMeetingsRequest {
  int64 user_id = 1;
}

message ListMeetingsResponse {
  repeated MeetingBooking bookings = 1;
}

message DonationRecord {
  int64 donation_id = 1;
  int64 sender_user_id = 2;
  int32 amount_value = 3;
  string currency = 4;
  optional string message = 5;
  string created_at = 6;
}

message ListReceivedDonationsRequest {
  int64 trainer_user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message ListReceivedDonationsResponse {
  repeated DonationRecord donations = 1;
  int32 total = 2;
}
