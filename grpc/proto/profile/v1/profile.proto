syntax = "proto3";

package sporttech.profile.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_SPORT.tech/grpc/gen/go/profile/v1;profilev1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service ProfileService {
  rpc CreateProfile(CreateProfileRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      post: "/v1/profiles"
      body: "*"
    };
  }

  rpc GetProfile(GetProfileRequest) returns (ProfileResponse) {
    option (google.api.http).get = "/v1/profiles/{user_id}";
  }

  rpc GetProfileByUsername(GetProfileByUsernameRequest) returns (ProfileResponse) {
    option (google.api.http).get = "/v1/profiles/by-username/{username}";
  }

  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/profiles/{user_id}"
      body: "*"
    };
  }

  rpc SetTrainer(SetTrainerRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      post: "/v1/profiles/{user_id}/trainer"
      body: "*"
    };
  }

  rpc GetPrivacySettings(GetPrivacySettingsRequest) returns (PrivacySettingsResponse) {
    option (google.api.http).get = "/v1/profiles/{user_id}/privacy";
  }

  rpc UpdatePrivacySettings(UpdatePrivacySettingsRequest) returns (PrivacySettingsResponse) {
    option (google.api.http) = {
      put: "/v1/profiles/{user_id}/privacy"
      body: "*"
    };
  }

  rpc SearchAuthors(SearchAuthorsRequest) returns (SearchAuthorsResponse) {
    option (google.api.http) = {
      post: "/v1/authors:search"
      body: "*"
    };
  }

  rpc UploadAvatar(UploadAvatarRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      post: "/v1/profiles/{user_id}/avatar"
      body: "*"
    };
  }

  rpc DeleteProfile(DeleteProfileRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/profiles/{user_id}";
  }

  rpc DeleteAvatar(DeleteAvatarRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/profiles/{user_id}/avatar";
  }

  rpc ListSportTypes(google.protobuf.Empty) returns (ListSportTypesResponse) {
    option (google.api.http).get = "/v1/sport-types";
  }

  rpc CreateMeasurement(CreateMeasurementRequest) returns (MeasurementResponse) {
    option (google.api.http) = {
      post: "/v1/profiles/{user_id}/measurements"
      body: "*"
    };
  }

  rpc ListMeasurements(ListMeasurementsRequest) returns (ListMeasurementsResponse) {
    option (google.api.http).get = "/v1/profiles/{user_id}/measurements";
  }

  rpc DeleteMeasurement(DeleteMeasurementRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/profiles/{user_id}/measurements/{measurement_id}";
  }

  rpc SetMeasurementSharing(SetMeasurementSharingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/v1/profiles/{client_user_id}/measurements/sharing"
      body: "*"
    };
  }

  rpc GetMeasurementSharing(GetMeasurementSharingRequest) returns (MeasurementSharingResponse) {
    option (google.api.http).get = "/v1/profiles/{client_user_id}/measurements/sharing";
  }
}

message TrainerSport {
  int64 sport_type_id = 1;
  int32 experience_years = 2;
  optional string sports_rank = 3;
}

message TrainerDetails {
  optional string education_degree = 1;
  optional google.protobuf.Timestamp career_since_date = 2;
  repeated TrainerSport sports = 3;
}

message Profile {
  int64 user_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  optional string bio = 5;
  optional string avatar_url = 6;
  bool is_trainer = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional TrainerDetails trainer_details = 10;
}

message AuthorSummary {
  int64 user_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  optional string bio = 5;
  optional string avatar_url = 6;
  optional TrainerDetails trainer_details = 7;
}

message SportType {
  int64 sport_type_id = 1;
  string name = 2;
}

message ProfileResponse {
  Profile profile = 1;
}

message CreateProfileRequest {
  int64 user_id = 1;
  string username = 2;
  string first_name = 3;
  string last_name = 4;
  optional string bio = 5;
  bool is_trainer = 6;
  optional TrainerDetails trainer_details = 7;
}

message SetTrainerRequest {
  int64 user_id = 1;
  optional TrainerDetails trainer_details = 2;
}

message PrivacySettings {
  bool show_profile_in_search = 1;
  bool allow_measurement_sharing = 2;
  bool show_activity_status = 3;
}

message GetPrivacySettingsRequest {
  int64 user_id = 1;
}

message UpdatePrivacySettingsRequest {
  int64 user_id = 1;
  PrivacySettings settings = 2;
}

message PrivacySettingsResponse {
  PrivacySettings settings = 1;
}

message GetProfileRequest {
  int64 user_id = 1;
}

message GetProfileByUsernameRequest {
  string username = 1;
}

message UpdateProfileRequest {
  int64 user_id = 1;
  optional string username = 2;
  optional string first_name = 3;
  optional string last_name = 4;
  optional string bio = 5;
  optional TrainerDetails trainer_details = 6;
}

message SearchAuthorsRequest {
  string query = 1;
  repeated int64 sport_type_ids = 2;
  int32 limit = 3;
  int32 offset = 4;
  optional int32 min_experience_years = 5;
  optional int32 max_experience_years = 6;
  bool only_with_rank = 7;
}

message SearchAuthorsResponse {
  repeated AuthorSummary authors = 1;
}

message UploadAvatarRequest {
  int64 user_id = 1;
  string file_name = 2;
  string content_type = 3;
  bytes content = 4;
}

message DeleteProfileRequest {
  int64 user_id = 1;
}

message DeleteAvatarRequest {
  int64 user_id = 1;
}

message ListSportTypesResponse {
  repeated SportType sport_types = 1;
}

message Measurement {
  int64 measurement_id = 1;
  int64 user_id = 2;
  google.protobuf.Timestamp measured_at = 3;
  optional double weight_kg = 4;
  optional double body_fat_pct = 5;
  optional int32 chest_cm = 6;
  optional int32 waist_cm = 7;
  optional int32 hips_cm = 8;
  optional string notes = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message MeasurementResponse {
  Measurement measurement = 1;
}

message ListMeasurementsResponse {
  repeated Measurement measurements = 1;
}

message CreateMeasurementRequest {
  int64 user_id = 1;
  string measured_at = 2;
  optional double weight_kg = 3;
  optional double body_fat_pct = 4;
  optional int32 chest_cm = 5;
  optional int32 waist_cm = 6;
  optional int32 hips_cm = 7;
  optional string notes = 8;
}

message ListMeasurementsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
  int64 viewer_user_id = 4;
}

message DeleteMeasurementRequest {
  int64 user_id = 1;
  int64 measurement_id = 2;
}

message SetMeasurementSharingRequest {
  int64 client_user_id = 1;
  repeated int64 trainer_user_ids = 2;
}

message GetMeasurementSharingRequest {
  int64 client_user_id = 1;
}

message MeasurementSharingResponse {
  repeated int64 trainer_user_ids = 1;
}
