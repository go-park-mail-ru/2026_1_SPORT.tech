syntax = "proto3";

package sporttech.gateway.v1;

option go_package = "github.com/go-park-mail-ru/2026_1_SPORT.tech/grpc/gen/go/gateway/v1;gatewayv1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service AuthService {
  rpc GetCSRFToken(google.protobuf.Empty) returns (CSRFTokenResponse) {
    option (google.api.http).get = "/v1/auth/csrf";
  }

  rpc RegisterClient(ClientRegisterRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register/client"
      body: "*"
    };
  }

  rpc RegisterTrainer(TrainerRegisterRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth/register/trainer"
      body: "*"
    };
  }

  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/v1/auth/login"
      body: "*"
    };
  }

  rpc GetMe(google.protobuf.Empty) returns (AuthResponse) {
    option (google.api.http).get = "/v1/auth/me";
  }

  rpc Logout(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http).post = "/v1/auth/logout";
  }
}

service ProfileService {
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse) {
    option (google.api.http).get = "/v1/profiles/{user_id}";
  }

  rpc ListTrainers(ListTrainersRequest) returns (GetTrainersResponse) {
    option (google.api.http).get = "/v1/trainers";
  }

  rpc SearchTrainers(ListTrainersRequest) returns (GetTrainersResponse) {
    option (google.api.http) = {
      post: "/v1/trainers:search"
      body: "*"
    };
  }

  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (ProfileResponse) {
    option (google.api.http) = {
      patch: "/v1/profiles/me"
      body: "*"
    };
  }

  rpc UploadMyAvatar(UploadMyAvatarRequest) returns (AvatarUploadResponse) {
    option (google.api.http) = {
      post: "/v1/profiles/me/avatar"
      body: "*"
    };
  }

  rpc DeleteMyAvatar(google.protobuf.Empty) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/profiles/me/avatar";
  }

  rpc ListProfilePosts(GetProfileRequest) returns (ProfilePostsResponse) {
    option (google.api.http).get = "/v1/profiles/{user_id}/posts";
  }

  rpc CreateMyMeasurement(CreateMeasurementRequest) returns (MeasurementResponse) {
    option (google.api.http) = {
      post: "/v1/measurements"
      body: "*"
    };
  }

  rpc ListMeasurements(ListMeasurementsRequest) returns (ListMeasurementsResponse) {
    option (google.api.http).get = "/v1/profiles/{user_id}/measurements";
  }

  rpc DeleteMyMeasurement(DeleteMeasurementRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/measurements/{measurement_id}";
  }

  // Установить список тренеров, которым клиент разрешает просматривать свои замеры.
  rpc SetMyMeasurementSharing(SetMeasurementSharingRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/v1/measurements/sharing"
      body: "*"
    };
  }

  // Получить список тренеров, которым клиент разрешил видеть свои замеры.
  rpc GetMyMeasurementSharing(google.protobuf.Empty) returns (MeasurementSharingResponse) {
    option (google.api.http).get = "/v1/measurements/sharing";
  }
}

service PostService {
  rpc SearchPosts(SearchPostsRequest) returns (SearchPostsResponse) {
    option (google.api.http) = {
      post: "/v1/posts:search"
      body: "*"
    };
  }

  rpc CreatePost(CreatePostRequest) returns (PostResponse) {
    option (google.api.http) = {
      post: "/v1/posts"
      body: "*"
    };
  }

  rpc UploadPostMedia(UploadPostMediaRequest) returns (PostMediaUploadResponse) {
    option (google.api.http) = {
      post: "/v1/posts/media"
      body: "*"
    };
  }

  rpc GetPost(GetPostRequest) returns (PostResponse) {
    option (google.api.http).get = "/v1/posts/{post_id}";
  }

  rpc UpdatePost(UpdatePostRequest) returns (PostResponse) {
    option (google.api.http) = {
      patch: "/v1/posts/{post_id}"
      body: "*"
    };
  }

  rpc DeletePost(DeletePostRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/posts/{post_id}";
  }

  rpc LikePost(PostLikeRequest) returns (PostLikeResponse) {
    option (google.api.http).post = "/v1/posts/{post_id}/likes";
  }

  rpc UnlikePost(PostLikeRequest) returns (PostLikeResponse) {
    option (google.api.http).delete = "/v1/posts/{post_id}/likes";
  }

  rpc CreateComment(CreateCommentRequest) returns (CommentResponse) {
    option (google.api.http) = {
      post: "/v1/posts/{post_id}/comments"
      body: "*"
    };
  }

  rpc ListComments(ListCommentsRequest) returns (ListCommentsResponse) {
    option (google.api.http).get = "/v1/posts/{post_id}/comments";
  }
}

service TierService {
  rpc ListTrainerTiers(TrainerTiersRequest) returns (TiersResponse) {
    option (google.api.http).get = "/v1/trainers/{trainer_id}/tiers";
  }

  rpc ListTiers(google.protobuf.Empty) returns (TiersResponse) {
    option (google.api.http).get = "/v1/tiers";
  }

  rpc CreateTier(CreateTierRequest) returns (Tier) {
    option (google.api.http) = {
      post: "/v1/tiers"
      body: "*"
    };
  }

  rpc UpdateTier(UpdateTierRequest) returns (Tier) {
    option (google.api.http) = {
      patch: "/v1/tiers/{tier_id}"
      body: "*"
    };
  }

  rpc DeleteTier(DeleteTierRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/tiers/{tier_id}";
  }
}

service SubscriptionService {
  rpc SubscribeToTrainer(SubscribeRequest) returns (Subscription) {
    option (google.api.http) = {
      post: "/v1/trainers/{trainer_id}/subscribe"
      body: "*"
    };
  }

  rpc ListMySubscriptions(google.protobuf.Empty) returns (SubscriptionsResponse) {
    option (google.api.http).get = "/v1/subscriptions/me";
  }

  rpc ListMySubscribers(ListSubscribersRequest) returns (SubscribersResponse) {
    option (google.api.http).get = "/v1/subscribers/me";
  }

  rpc UpdateSubscription(UpdateSubscriptionRequest) returns (Subscription) {
    option (google.api.http) = {
      patch: "/v1/subscriptions/{subscription_id}"
      body: "*"
    };
  }

  rpc CancelSubscription(CancelSubscriptionRequest) returns (google.protobuf.Empty) {
    option (google.api.http).delete = "/v1/subscriptions/{subscription_id}";
  }
}

service SportService {
  rpc ListSportTypes(google.protobuf.Empty) returns (SportTypesResponse) {
    option (google.api.http).get = "/v1/sport-types";
  }
}

service DonationService {
  rpc DonateToProfile(DonateToProfileRequest) returns (DonationResponse) {
    option (google.api.http) = {
      post: "/v1/profiles/{user_id}/donations"
      body: "*"
    };
  }

  rpc GetMyBalance(google.protobuf.Empty) returns (BalanceResponse) {
    option (google.api.http).get = "/v1/balance";
  }

  // История полученных донатов (для тренера).
  rpc ListMyReceivedDonations(ListDonationsRequest) returns (ListDonationsResponse) {
    option (google.api.http).get = "/v1/donations/received";
  }
}

service PaymentService {
  rpc CreateDonationPayment(CreateDonationPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/donations"
      body: "*"
    };
  }

  rpc CreateSubscriptionPayment(CreateSubscriptionPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/subscriptions"
      body: "*"
    };
  }

  rpc ConfirmDonationPayment(ConfirmDonationPaymentRequest) returns (PaymentResponse) {
    option (google.api.http) = {
      post: "/v1/payments/{payment_id}/confirm"
      body: "*"
    };
  }
}

service StatisticsService {
  rpc GetMyStatistics(google.protobuf.Empty) returns (StatisticsResponse) {
    option (google.api.http).get = "/v1/statistics/me";
  }
}

service NotificationService {
  rpc ListMyNotifications(ListNotificationsRequest) returns (ListNotificationsResponse) {
    option (google.api.http).get = "/v1/notifications";
  }

  rpc MarkNotificationRead(MarkNotificationReadRequest) returns (NotificationResponse) {
    option (google.api.http) = {
      patch: "/v1/notifications/{notification_id}/read"
      body: "*"
    };
  }
}

message ValidationErrorField {
  string field = 1;
  string message = 2;
}

message Error {
  string code = 1;
  string message = 2;
  repeated ValidationErrorField fields = 3;
}

message ErrorResponse {
  Error error = 1;
}

message User {
  int32 user_id = 1;
  string username = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool is_trainer = 6;
  bool is_admin = 7;
  string first_name = 8;
  string last_name = 9;
  optional string bio = 10;
  optional string avatar_url = 11;
}

message TrainerSport {
  int32 sport_type_id = 1;
  int32 experience_years = 2;
  optional string sports_rank = 3;
}

message TrainerDetails {
  optional string education_degree = 1;
  optional string career_since_date = 2;
  repeated TrainerSport sports = 3;
}

message ClientRegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string password_repeat = 4;
  string first_name = 5;
  string last_name = 6;
}

message TrainerRegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string password_repeat = 4;
  string first_name = 5;
  string last_name = 6;
  TrainerDetails trainer_details = 7;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  User user = 1;
}

message CSRFTokenResponse {
  string csrf_token = 1;
}

message GetProfileRequest {
  int32 user_id = 1;
}

message ProfileResponse {
  int32 user_id = 1;
  bool is_me = 2;
  bool is_trainer = 3;
  string username = 4;
  string first_name = 5;
  string last_name = 6;
  optional string bio = 7;
  optional string avatar_url = 8;
  optional TrainerDetails trainer_details = 9;
}

message TrainerListItem {
  int32 user_id = 1;
  bool is_trainer = 2;
  string username = 3;
  string first_name = 4;
  string last_name = 5;
  optional string bio = 6;
  optional string avatar_url = 7;
  optional TrainerDetails trainer_details = 8;
}

message GetTrainersResponse {
  repeated TrainerListItem trainers = 1;
}

message ListTrainersRequest {
  string query = 1;
  repeated int32 sport_type_ids = 2;
  int32 limit = 3;
  int32 offset = 4;
  optional int32 min_experience_years = 5;
  optional int32 max_experience_years = 6;
  bool only_with_rank = 7;
}

message UpdateMyProfileRequest {
  optional string username = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string bio = 4;
  optional TrainerDetails trainer_details = 5;
}

message UploadMyAvatarRequest {
  bytes avatar = 1;
  string file_name = 2;
  string content_type = 3;
}

message AvatarUploadResponse {
  string avatar_url = 1;
}

message SportType {
  int32 sport_type_id = 1;
  string name = 2;
}

message SportTypesResponse {
  repeated SportType sport_types = 1;
}

message PostBlockInput {
  string kind = 1;
  optional string text_content = 2;
  optional string file_url = 3;
}

message UploadPostMediaRequest {
  bytes file = 1;
  string file_name = 2;
  string content_type = 3;
}

message PostMediaUploadResponse {
  string file_url = 1;
  string kind = 2;
  string content_type = 3;
  int32 size_bytes = 4;
}

message CreatePostRequest {
  optional int32 min_tier_id = 1;
  string title = 2;
  repeated PostBlockInput blocks = 3;
  optional int32 sport_type_id = 4;
}

message UpdatePostRequest {
  int32 post_id = 1;
  optional int32 min_tier_id = 2;
  optional string title = 3;
  repeated PostBlockInput blocks = 4;
  bool replace_blocks = 5;
  bool clear_min_tier_id = 6;
  optional int32 sport_type_id = 7;
  bool clear_sport_type_id = 8;
}

message PostBlock {
  int32 post_block_id = 1;
  int32 position = 2;
  string kind = 3;
  optional string text_content = 4;
  optional string file_url = 5;
}

message PostListItem {
  int32 post_id = 1;
  int32 trainer_id = 2;
  optional int32 min_tier_id = 3;
  string title = 4;
  google.protobuf.Timestamp created_at = 5;
  bool can_view = 6;
  int32 likes_count = 7;
  bool is_liked = 8;
  int32 comments_count = 9;
  optional int32 sport_type_id = 10;
}

message ProfilePostsResponse {
  int32 user_id = 1;
  repeated PostListItem posts = 2;
}

message SearchPostsRequest {
  string query = 1;
  repeated int32 trainer_ids = 2;
  repeated string block_kinds = 3;
  optional int32 min_tier_id = 4;
  optional int32 max_tier_id = 5;
  bool only_available = 6;
  int32 limit = 7;
  int32 offset = 8;
  repeated int32 sport_type_ids = 9;
  string sort = 10;
}

message SearchPostsResponse {
  repeated PostListItem posts = 1;
}

message PostResponse {
  int32 post_id = 1;
  int32 trainer_id = 2;
  optional int32 min_tier_id = 3;
  string title = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int32 likes_count = 7;
  bool is_liked = 8;
  repeated PostBlock blocks = 9;
  bool can_view = 10;
  int32 comments_count = 11;
  optional int32 sport_type_id = 12;
}

message GetPostRequest {
  int32 post_id = 1;
}

message DeletePostRequest {
  int32 post_id = 1;
}

message PostLikeRequest {
  int32 post_id = 1;
}

message PostLikeResponse {
  int32 post_id = 1;
  int32 likes_count = 2;
  bool is_liked = 3;
}

message CreateCommentRequest {
  int32 post_id = 1;
  string body = 2;
}

message ListCommentsRequest {
  int32 post_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message Comment {
  int32 comment_id = 1;
  int32 post_id = 2;
  int32 author_user_id = 3;
  string body = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CommentResponse {
  Comment comment = 1;
}

message ListCommentsResponse {
  repeated Comment comments = 1;
}

message Tier {
  int32 tier_id = 1;
  string name = 2;
  int32 price = 3;
  optional string description = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message TiersResponse {
  repeated Tier tiers = 1;
}

message CreateTierRequest {
  string name = 1;
  int32 price = 2;
  optional string description = 3;
}

message UpdateTierRequest {
  int32 tier_id = 1;
  optional string name = 2;
  optional int32 price = 3;
  optional string description = 4;
  bool clear_description = 5;
}

message DeleteTierRequest {
  int32 tier_id = 1;
}

message TrainerTiersRequest {
  int32 trainer_id = 1;
}

message SubscribeRequest {
  int32 trainer_id = 1;
  int32 tier_id = 2;
}

message Subscription {
  int32 subscription_id = 1;
  int32 trainer_id = 2;
  int32 tier_id = 3;
  string tier_name = 4;
  int32 price = 5;
  bool active = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SubscriptionsResponse {
  repeated Subscription subscriptions = 1;
}

message Subscriber {
  int32 subscription_id = 1;
  int32 client_id = 2;
  int32 tier_id = 3;
  string tier_name = 4;
  int32 price = 5;
  bool active = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListSubscribersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message SubscribersResponse {
  repeated Subscriber subscribers = 1;
}

message UpdateSubscriptionRequest {
  int32 subscription_id = 1;
  int32 tier_id = 2;
}

message CancelSubscriptionRequest {
  int32 subscription_id = 1;
}

message DonateToProfileRequest {
  int32 user_id = 1;
  int32 amount_value = 2;
  string currency = 3;
  optional string message = 4;
}

message DonationResponse {
  int32 donation_id = 1;
  int32 sender_user_id = 2;
  int32 recipient_user_id = 3;
  int32 amount_value = 4;
  string currency = 5;
  optional string message = 6;
  google.protobuf.Timestamp created_at = 7;
}

message BalanceResponse {
  int32 trainer_id = 1;
  int32 amount_value = 2;
  string currency = 3;
}

message CreateDonationPaymentRequest {
  int32 user_id = 1;
  int32 amount_value = 2;
  string currency = 3;
  optional string message = 4;
  optional string return_url = 5;
  optional string cancel_url = 6;
}

message CreateSubscriptionPaymentRequest {
  int32 trainer_id = 1;
  int32 tier_id = 2;
  optional string return_url = 3;
  optional string cancel_url = 4;
}

message ConfirmDonationPaymentRequest {
  int32 payment_id = 1;
  string confirmation_token = 2;
}

message PaymentDonation {
  int32 donation_id = 1;
  int32 sender_user_id = 2;
  int32 recipient_user_id = 3;
  int32 amount_value = 4;
  string currency = 5;
  optional string message = 6;
  google.protobuf.Timestamp created_at = 7;
}

message PaymentResponse {
  int32 payment_id = 1;
  string provider_payment_id = 2;
  string status = 3;
  int32 sender_user_id = 4;
  int32 recipient_user_id = 5;
  int32 amount_value = 6;
  string currency = 7;
  optional string message = 8;
  string confirmation_token = 9;
  string confirmation_url = 10;
  optional PaymentDonation donation = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  optional google.protobuf.Timestamp confirmed_at = 14;
  optional Subscription subscription = 15;
}

message StatisticsResponse {
  int32 trainer_id = 1;
  int32 posts_count = 2;
  int32 donations_count = 3;
  int32 total_revenue = 4;
  int32 monthly_revenue = 5;
  string currency = 6;
}

message Notification {
  int32 notification_id = 1;
  int32 user_id = 2;
  string type = 3;
  int32 actor_user_id = 4;
  string title = 5;
  string body = 6;
  bool is_read = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp read_at = 9;
  optional int32 post_id = 10;
  optional int32 comment_id = 11;
  optional int32 donation_id = 12;
  optional int32 subscription_id = 13;
}

message ListNotificationsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message MarkNotificationReadRequest {
  int32 notification_id = 1;
}

message NotificationResponse {
  Notification notification = 1;
}

message ListNotificationsResponse {
  repeated Notification notifications = 1;
}

message Measurement {
  int64 measurement_id = 1;
  int64 user_id = 2;
  google.protobuf.Timestamp measured_at = 3;
  optional double weight_kg = 4;
  optional double body_fat_pct = 5;
  optional int32 chest_cm = 6;
  optional int32 waist_cm = 7;
  optional int32 hips_cm = 8;
  optional string notes = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message MeasurementResponse {
  Measurement measurement = 1;
}

message ListMeasurementsResponse {
  repeated Measurement measurements = 1;
}

message CreateMeasurementRequest {
  string measured_at = 1; // "YYYY-MM-DD"
  optional double weight_kg = 2;
  optional double body_fat_pct = 3;
  optional int32 chest_cm = 4;
  optional int32 waist_cm = 5;
  optional int32 hips_cm = 6;
  optional string notes = 7;
}

message ListMeasurementsRequest {
  int64 user_id = 1;
  int32 limit = 2;
  int32 offset = 3;
}

message DeleteMeasurementRequest {
  int64 measurement_id = 1;
}

message SetMeasurementSharingRequest {
  // Список trainer_user_id, которым клиент разрешает доступ к своим замерам.
  // Пустой список — отозвать доступ у всех.
  repeated int64 trainer_user_ids = 1;
}

message MeasurementSharingResponse {
  repeated int64 trainer_user_ids = 1;
}

message DonationItem {
  int64 donation_id = 1;
  int64 sender_user_id = 2;
  int32 amount_value = 3;
  string currency = 4;
  optional string message = 5;
  string created_at = 6;
}

message ListDonationsRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListDonationsResponse {
  repeated DonationItem donations = 1;
  int32 total = 2;
}
