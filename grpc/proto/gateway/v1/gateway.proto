message ValidationErrorField {
  string field = 1;
  string message = 2;
}

message Error {
  string code = 1;
  string message = 2;
  repeated ValidationErrorField fields = 3;
}

message ErrorResponse {
  Error error = 1;
}

message User {
  int32 user_id = 1;
  string username = 2;
  string email = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool is_trainer = 6;
  bool is_admin = 7;
  string first_name = 8;
  string last_name = 9;
  optional string bio = 10;
  optional string avatar_url = 11;
}

message TrainerSport {
  int32 sport_type_id = 1;
  int32 experience_years = 2;
  optional string sports_rank = 3;
}

message TrainerDetails {
  optional string education_degree = 1;
  optional string career_since_date = 2;
  repeated TrainerSport sports = 3;
}

message ClientRegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string password_repeat = 4;
  string first_name = 5;
  string last_name = 6;
}

message TrainerRegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  string password_repeat = 4;
  string first_name = 5;
  string last_name = 6;
  TrainerDetails trainer_details = 7;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message AuthResponse {
  User user = 1;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
  string new_password_repeat = 3;
}

message ChangeEmailRequest {
  string new_email = 1;
  string current_password = 2;
}

message BecomeTrainerRequest {
  TrainerDetails trainer_details = 1;
}

message DeleteAccountRequest {
  string current_password = 1;
}

message CSRFTokenResponse {
  string csrf_token = 1;
}

message GetProfileRequest {
  int32 user_id = 1;
}

message GetProfileByUsernameRequest {
  string username = 1;
}

message ProfileResponse {
  int32 user_id = 1;
  bool is_me = 2;
  bool is_trainer = 3;
  string username = 4;
  string first_name = 5;
  string last_name = 6;
  optional string bio = 7;
  optional string avatar_url = 8;
  optional TrainerDetails trainer_details = 9;
}

message TrainerListItem {
  int32 user_id = 1;
  bool is_trainer = 2;
  string username = 3;
  string first_name = 4;
  string last_name = 5;
  optional string bio = 6;
  optional string avatar_url = 7;
  optional TrainerDetails trainer_details = 8;
}

message GetTrainersResponse {
  repeated TrainerListItem trainers = 1;
}

message ListTrainersRequest {
  string query = 1;
  repeated int32 sport_type_ids = 2;
  int32 limit = 3;
  int32 offset = 4;
  optional int32 min_experience_years = 5;
  optional int32 max_experience_years = 6;
  bool only_with_rank = 7;
}

message UpdateMyProfileRequest {
  optional string username = 1;
  optional string first_name = 2;
  optional string last_name = 3;
  optional string bio = 4;
  optional TrainerDetails trainer_details = 5;
}

message UploadMyAvatarRequest {
  bytes avatar = 1;
  string file_name = 2;
  string content_type = 3;
}

message AvatarUploadResponse {
  string avatar_url = 1;
}

message SportType {
  int32 sport_type_id = 1;
  string name = 2;
}

message SportTypesResponse {
  repeated SportType sport_types = 1;
}

message PostBlockInput {
  string kind = 1;
  optional string text_content = 2;
  optional string file_url = 3;
}

message UploadPostMediaRequest {
  bytes file = 1;
  string file_name = 2;
  string content_type = 3;
}

message PostMediaUploadResponse {
  string file_url = 1;
  string kind = 2;
  string content_type = 3;
  int32 size_bytes = 4;
}

message CreatePostRequest {
  optional int32 min_tier_id = 1;
  string title = 2;
  repeated PostBlockInput blocks = 3;
  optional int32 sport_type_id = 4;
  repeated int32 sport_type_ids = 5;
}

message UpdatePostRequest {
  int32 post_id = 1;
  optional int32 min_tier_id = 2;
  optional string title = 3;
  repeated PostBlockInput blocks = 4;
  bool replace_blocks = 5;
  bool clear_min_tier_id = 6;
  optional int32 sport_type_id = 7;
  bool clear_sport_type_id = 8;
  optional bool is_pinned = 9;
  repeated int32 sport_type_ids = 10;
  bool clear_sport_type_ids = 11;
}

message PostBlock {
  int32 post_block_id = 1;
  int32 position = 2;
  string kind = 3;
  optional string text_content = 4;
  optional string file_url = 5;
}

message PostListItem {
  int32 post_id = 1;
  int32 trainer_id = 2;
  optional int32 min_tier_id = 3;
  string title = 4;
  google.protobuf.Timestamp created_at = 5;
  bool can_view = 6;
  int32 likes_count = 7;
  bool is_liked = 8;
  int32 comments_count = 9;
  optional int32 sport_type_id = 10;
  bool is_pinned = 11;
  repeated int32 sport_type_ids = 12;
}

message ProfilePostsResponse {
  int32 user_id = 1;
  repeated PostListItem posts = 2;
}

message SearchPostsRequest {
  string query = 1;
  repeated int32 trainer_ids = 2;
  repeated string block_kinds = 3;
  optional int32 min_tier_id = 4;
  optional int32 max_tier_id = 5;
  bool only_available = 6;
  int32 limit = 7;
  int32 offset = 8;
  repeated int32 sport_type_ids = 9;
  string sort = 10;
}

message SearchPostsResponse {
  repeated PostListItem posts = 1;
}

message PostResponse {
  int32 post_id = 1;
  int32 trainer_id = 2;
  optional int32 min_tier_id = 3;
  string title = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int32 likes_count = 7;
  bool is_liked = 8;
  repeated PostBlock blocks = 9;
  bool can_view = 10;
  int32 comments_count = 11;
  optional int32 sport_type_id = 12;
  bool is_pinned = 13;
  repeated int32 sport_type_ids = 14;
}

message GetPostRequest {
  int32 post_id = 1;
}

message DeletePostRequest {
  int32 post_id = 1;
}

message PostLikeRequest {
  int32 post_id = 1;
}

message PostLikeResponse {
